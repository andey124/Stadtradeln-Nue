name: Scrape STADTRADELN Data

on:
  schedule:
    # 08:00 and 18:00 CET (UTC+2 in summer) = 06:00 and 16:00 UTC
    - cron: "0 6 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium --with-deps

      - name: Run scraper
        run: python scripts/scrape.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/snapshots.json
          git diff --staged --quiet || git commit -m "chore: update STADTRADELN data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
